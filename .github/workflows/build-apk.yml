name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android .

      - name: Force compile SDK 36 for app and all plugins
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          printf '%s\n' 'gradle.beforeProject { p ->' '    p.afterEvaluate {' '        if (p.hasProperty("android")) {' '            p.android.compileSdkVersion 36' '        }' '    }' '}' > "$HOME/.gradle/init.d/force-sdk.gradle"
          echo "== init script ==" && cat "$HOME/.gradle/init.d/force-sdk.gradle"

      - name: Set app name shown on phone
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Zeeshan Daily Life Style"/' android/app/src/main/AndroidManifest.xml

      - name: Install packages
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zeeshan-daily-life-style-apk
          path: build/app/outputs/flutter-apk/app-release.apk
